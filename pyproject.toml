[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytemplate-cli"
version = "0.1.0"
description = "Professional Python CLI tool template with argparse, logging, and config management"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
pytemplate-cli = "pytemplate_cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
